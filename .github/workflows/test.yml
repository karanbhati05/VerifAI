name: VerifAI CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Spring Boot Backend Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Maven Tests
      working-directory: ./verifai-backend
      run: mvn test

  ai-engine-tests:
    name: Python AI Engine Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (Tesseract & OpenCV libs)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

    - name: Install Python Test Dependencies
      working-directory: ./ai-engine
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn python-multipart pillow numpy pytest httpx

    - name: Run Pytest
      working-directory: ./ai-engine
      run: pytest tests/ -v
