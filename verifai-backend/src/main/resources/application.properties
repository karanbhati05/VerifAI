# App Name
spring.application.name=VerifAI

# --- SERVER PORT (Dynamic for Render or default 8081) ---
server.port=${PORT:8081}

# --- DATABASE CONNECTION (Supports TiDB Cloud MySQL, Local MySQL, or In-Memory H2) ---
# For Zero-Setup Free Demo: Set SPRING_DATASOURCE_URL=jdbc:h2:mem:verifai_db;DB_CLOSE_DELAY=-1
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/verifai_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# --- JPA SETTINGS ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- FILE UPLOAD LIMITS ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- AI ENGINE MICROSERVICE ---
ai.engine.url=${AI_ENGINE_URL:http://127.0.0.1:5000/verify}